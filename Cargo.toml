[workspace]
members = [
    "crates/noi-core",
    "crates/noi-build",
    "crates/noi-macro",
    "crates/noi",
    "examples/demo",
    "examples/dark-pool",
]
resolver = "2"

[workspace.package]
authors = ["noi contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.74"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
camino = "1.1"
"fs-err" = "2.11"
heck = "0.4"
indexmap = { version = "2.2", features = ["serde"] }
itertools = "0.12"
once_cell = "1.19"
proc-macro-error = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.8"
syn = { version = "2.0", features = ["full"] }
thiserror = "1.0"
tempfile = "3.10"
walkdir = "2.5"
