[workspace]
members = [
    "crates/noi-core",
    "crates/noi-build",
    "crates/noi-macro",
    "crates/noi",
    "examples/demo",
    "examples/dark-pool",
]
resolver = "2"

[workspace.package]
authors = ["noi contributors"]
edition = "2021"
license = "Apache-2.0"
# Matches the MSRV of the pinned Noir crates.
rust-version = "1.89"
version = "0.0.2"
repository = "https://github.com/hopeyen/noi"
homepage = "https://github.com/hopeyen/noi"
documentation = "https://docs.rs/noi"

[workspace.dependencies]
# Noir execution crates, from crates.io. Keep the version in sync with `noi_core::NOIR_VERSION`,
# `scripts/refresh_exports.sh`, and the README; artifacts are decoded with the matching release.
acir_field = { version = "1.0.0", features = ["bn254"] }
acvm = { version = "1.0.0", default-features = false, features = ["bn254"] }
bn254_blackbox_solver = "1.0.0"
anyhow = "1.0"
heck = "0.5"
"fs-err" = "2.11"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full"] }
tempfile = "3.10"
toml = "0.8"
