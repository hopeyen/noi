[workspace]
members = [
    "crates/noi-core",
    "crates/noi-build",
    "crates/noi-macro",
    "crates/noi",
    "examples/demo",
    "examples/dark-pool",
]
resolver = "2"

[workspace.package]
authors = ["noi contributors"]
edition = "2021"
license = "Apache-2.0"
# Matches the MSRV of the pinned Noir crates.
rust-version = "1.89"
version = "0.0.2"
repository = "https://github.com/hopeyen/noi"
homepage = "https://github.com/hopeyen/noi"
documentation = "https://docs.rs/noi"

[workspace.dependencies]
# Noir toolchain crates. Keep the tag in sync with `noi_core::NOIR_VERSION`, the README, and
# `scripts/refresh_exports.sh`; artifacts are only decodable by the matching release.
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26" }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26" }
# `rpc` enables JSON-RPC oracle resolvers (`Client::with_oracle_resolver`).
nargo = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26", features = ["rpc"] }
noirc_abi = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26" }
noirc_artifacts = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26" }
anyhow = "1.0"
heck = "0.5"
"fs-err" = "2.11"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
tempfile = "3.10"

[patch.crates-io]
noi-core = { path = "crates/noi-core" }
noi-build = { path = "crates/noi-build" }
noi-macro = { path = "crates/noi-macro" }
noi = { path = "crates/noi" }
