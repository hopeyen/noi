name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # CI runners have no nargo; build against the committed export/ artifacts without warnings.
  NOI_SKIP_NARGO: "1"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Default features
        run: cargo test --workspace
      - name: Schema only (no runner)
        run: |
          cargo test -p noi-core --no-default-features
          cargo test -p noi --no-default-features --tests
      - name: Field without runner
        run: |
          cargo check -p noi --no-default-features --features field
          cargo check -p noi-core --no-default-features --features field

  msrv:
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the development toolchain; override it for this job.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo --version && cargo check --workspace --all-targets --all-features

  package:
    # Packages every publishable crate and builds it from the packaged sources, as `cargo publish`
    # would, then runs the tests shipped inside each package (they must not read files outside it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --exclude noi-example-app --exclude noi-dark-pool-example
      - name: Licenses are packaged
        run: |
          v="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "noi") | .version')"
          for c in noi noi-core noi-build noi-macro; do
            tar -tzf "target/package/$c-$v.crate" | grep -qx "$c-$v/LICENSE" || { echo "::error::$c-$v.crate has no LICENSE"; exit 1; }
          done
      - run: scripts/test_packaged.sh

  prove:
    runs-on: ubuntu-latest
    env:
      # Fail rather than skip the proving tests if bb is missing.
      NOI_REQUIRE_BB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Install bb
        # A separate assignment so a failed install fails the step.
        run: |
          bb="$(scripts/install_bb.sh)"
          echo "NOI_BB_BIN=$bb" >> "$GITHUB_ENV"
      - run: cargo test -p noi-core -p noi --features noi-core/prove,noi/prove
      - run: cargo run -p noi-example-app --features prove

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p noi -p noi-core -p noi-build -p noi-macro --all-features
        env:
          RUSTDOCFLAGS: -D warnings
