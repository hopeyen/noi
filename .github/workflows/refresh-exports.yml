name: Refresh Noir exports

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - name: Refresh demo + dark-pool exports
        run: scripts/refresh_exports.sh
      - name: Ensure exports are committed
        run: scripts/check_exports.py
      - name: noi-build against the real nargo
        run: NOI_NARGO_BIN="$PWD/target/nargo-bin/1.0.0/nargo" NOI_REQUIRE_NARGO=1 cargo test -p noi-build
