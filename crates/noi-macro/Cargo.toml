[package]
name = "noi-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Proc macro that generates strongly typed Rust bindings for Noir exports"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/noi-macro"
readme = "README.md"
keywords = ["noir", "zk", "bindings"]
categories = ["development-tools::procedural-macro-helpers", "cryptography"]

[lib]
proc-macro = true

[dependencies]
heck.workspace = true
noi-core = { version = "0.0.2", path = "../noi-core", default-features = false }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
