[package]
name = "noi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Runtime glue for the noi Noir-to-Rust bindings"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/noi-core"
readme = "README.md"
keywords = ["noir", "zk", "bindings"]
categories = ["cryptography"]

[features]
default = ["runner"]
runner = ["dep:noir-runner", "dep:acvm"]
prove = []
field = ["dep:acvm"]

[dependencies]
anyhow.workspace = true
camino.workspace = true
"fs-err".workspace = true
indexmap.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
walkdir.workspace = true
acvm = { workspace = true, optional = true }
noir-runner = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
