[package]
name = "noi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Runtime glue for the noi Noir-to-Rust bindings"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/noi-core"
readme = "README.md"
keywords = ["noir", "zk", "bindings"]
categories = ["cryptography"]

[package.metadata.docs.rs]
# Document the proving API too.
all-features = true

[features]
default = ["runner"]
runner = ["field", "dep:acvm", "dep:bn254_blackbox_solver"]
prove = ["runner", "dep:sha2", "dep:tempfile"]
field = ["dep:acir_field"]

[dependencies]
anyhow.workspace = true
"fs-err".workspace = true
serde.workspace = true
serde_json.workspace = true
acir_field = { workspace = true, optional = true }
acvm = { workspace = true, optional = true }
bn254_blackbox_solver = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
