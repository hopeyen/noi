[package]
name = "noi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Rust interface to generated Noir bindings"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/noi"
readme = "README.md"
keywords = ["noir", "zk", "bindings"]
categories = ["cryptography"]

[package.metadata.docs.rs]
# Document the proving API too.
all-features = true

[features]
default = ["runner"]
# Execute exports from Rust (`simulate`/`execute`). Pulls in the Noir execution crates.
runner = ["noi-core/runner", "noi-macro/runner"]
# Generate `prove`/`verify`/`verification_key`, backed by Barretenberg's `bb` CLI. Implies `runner`.
prove = ["runner", "noi-core/prove", "noi-macro/prove"]
# Use `acvm::FieldElement` for Noir `Field` values without enabling `runner`.
field = ["noi-core/field", "noi-macro/field"]

[dependencies]
anyhow.workspace = true
noi-core = { version = "0.0.2", default-features = false }
noi-macro = { version = "0.0.2", default-features = false }

[dev-dependencies]
# Lets the build.rs snippet in the crate docs compile as a doctest.
noi-build = { version = "0.0.2" }
tempfile.workspace = true
