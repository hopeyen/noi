[package]
name = "noi-build"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Build helper that runs `nargo export` and stages artifacts for noi"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/noi-build"
readme = "README.md"
keywords = ["noir", "zk", "bindings"]
categories = ["development-tools::build-utilities", "cryptography"]

[dependencies]
anyhow.workspace = true
"fs-err".workspace = true
# Schema-only (no Noir compiler crates); used for `NOIR_VERSION`.
noi-core = { version = "0.0.2", default-features = false }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
